$kind: http-request
description: |-
  This is a POST request, submitting data to an API via the request body. This request submits JSON data, and the data is reflected in the response.

  A successful POST request typically returns a `200 OK` or `201 Created` response code.
url: http://localhost:3000/posts
method: POST
body:
  type: json
  content: |-
    {
    	"titulo": "Teste supremo 3.6",
        "conteudo": "Ola mundo",
        "disciplina": "Geografia",
        "autor": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Successful POST request", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      pm.test("Response content-type is JSON", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response body reflects the payload sent", function () {
          const responseJson = pm.response.json();
          const sentPayload = JSON.parse(pm.request.body.raw || "{}");
          const returnedPayload = responseJson.data ? JSON.parse(responseJson.data) : {};

          pm.expect(returnedPayload).to.deep.equal(sentPayload);
      });

      pm.test("Response body has the expected basic structure", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.be.an("object");
          pm.expect(jsonData).to.have.property("data");
          pm.expect(jsonData).to.have.property("headers");
          pm.expect(jsonData).to.have.property("url");
          pm.expect(jsonData.headers).to.be.an("object");
          pm.expect(jsonData.url).to.be.a("string");
      });
    language: text/javascript
order: 1000
