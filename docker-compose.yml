version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: tech-challenge-db
    restart: always
    environment:
      POSTGRES_USER: blog_tech
      POSTGRES_PASSWORD: tech20262
      POSTGRES_DB: blog_tech_2_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: